[project]
name = "basketpilot"
version = "0.1.0"
description = "Phase 1 POC: search Indian quick-commerce catalogues via TinyFish, with a local stealth-browser rescue path"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cloakbrowser>=0.6.3",
]

[project.scripts]
basketpilot = "basketpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basketpilot"]
